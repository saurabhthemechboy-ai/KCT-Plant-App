name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Create TWA project
        run: |
          mkdir -p android-app
          cd android-app
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.kct.plantapp",
            "host": "kct-plant-app.web.app",
            "name": "KCT Plant",
            "launcherName": "KCT Plant",
            "display": "standalone",
            "themeColor": "#0288d1",
            "navigationColor": "#0288d1",
            "navigationColorDark": "#01579b",
            "navigationDividerColor": "#0288d1",
            "navigationDividerColorDark": "#01579b",
            "backgroundColor": "#0288d1",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "maskableIconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kct-plant-app.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "isChromeOSOnly": false,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "kct"
            }
          }
          EOF

      - name: Copy keystore
        run: cp android.keystore android-app/android.keystore

      - name: Update Bubblewrap config
        run: |
          # Bubblewrap wants a specific SDK folder structure.
          # Point it at the actual path AND run updateConfig.
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          cd android-app
          bubblewrap updateConfig --androidSdkPath "$ANDROID_HOME" || true
          bubblewrap updateConfig --jdkPath "$JAVA_HOME" || true
          echo "--- Config after update ---"
          cat ~/.bubblewrap/config.json

      - name: Try to locate SDK's build folder
        run: |
          echo "--- Searching for 'build' folder in SDK ---"
          find $ANDROID_HOME -maxdepth 3 -type d -name "build*" 2>/dev/null | head
          echo "--- cmdline-tools contents ---"
          ls -la $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || echo "no latest"
          echo "--- Root of SDK ---"
          ls -la $ANDROID_HOME

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-app
          bubblewrap build --skipPwaValidation || {
            echo "❌ Build failed. Trying with doctor workaround..."
            mkdir -p $ANDROID_HOME/build 2>/dev/null || true
            bubblewrap updateConfig --androidSdkPath "$ANDROID_HOME" || true
            bubblewrap build --skipPwaValidation
          }

      - name: Verify APK
        if: always()
        run: |
          echo "--- Files in android-app ---"
          ls -la android-app/
          echo "--- APK search ---"
          find . -name "*.apk" -type f -exec ls -la {} \; || echo "No APK found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: |
            android-app/app-release-signed.apk
            android-app/*.json
          if-no-files-found: warn
