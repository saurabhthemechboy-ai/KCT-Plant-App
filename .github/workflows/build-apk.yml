name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show Android SDK
        run: |
          ls -la $ANDROID_HOME
          ls -la $ANDROID_HOME/cmdline-tools
          ls -la $ANDROID_HOME/platforms || echo "no platforms"
          ls -la $ANDROID_HOME/build-tools || echo "no build-tools"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Create TWA project
        run: |
          mkdir -p android-app
          cd android-app

          # Pre-seed Bubblewrap config — this is CRITICAL
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.kct.plantapp",
            "host": "kct-plant-app.web.app",
            "name": "KCT Plant",
            "launcherName": "KCT Plant",
            "display": "standalone",
            "themeColor": "#0288d1",
            "navigationColor": "#0288d1",
            "navigationColorDark": "#01579b",
            "navigationDividerColor": "#0288d1",
            "navigationDividerColorDark": "#01579b",
            "backgroundColor": "#0288d1",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "maskableIconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kct-plant-app.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "isChromeOSOnly": false,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "kct"
            }
          }
          EOF

      - name: Copy keystore
        run: cp android.keystore android-app/android.keystore

      - name: Run Bubblewrap doctor (diagnostic)
        run: |
          cd android-app
          bubblewrap doctor || true

      - name: Build APK (fail on error)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-app
          bubblewrap build --skipPwaValidation

      - name: Verify APK exists
        run: |
          ls -la android-app/
          if [ ! -f android-app/app-release-signed.apk ]; then
            echo "❌ APK NOT CREATED"
            exit 1
          fi
          echo "✅ APK created successfully"
          ls -la android-app/app-release-signed.apk

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: |
            android-app/app-release-signed.apk
            android-app/*.json
          if-no-files-found: error
