name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_INSTALL_JDK: "false"
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java
        run: java -version

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore
          ls -la android.keystore

      - name: Create project directory and config
        run: |
          mkdir -p android-app
          cd android-app

          cat > twa-manifest.json <<EOF
          {
            "packageId": "com.kct.plantapp",
            "host": "kct-plant-app.web.app",
            "name": "KCT Plant",
            "launcherName": "KCT Plant",
            "display": "standalone",
            "themeColor": "#0288d1",
            "navigationColor": "#0288d1",
            "navigationColorDark": "#01579b",
            "navigationDividerColor": "#0288d1",
            "navigationDividerColorDark": "#01579b",
            "backgroundColor": "#0288d1",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "maskableIconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kct-plant-app.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "isChromeOSOnly": false,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            }
          }
          EOF

          echo "--- twa-manifest.json created ---"
          cat twa-manifest.json

      - name: Copy keystore into android-app
        run: |
          cp android.keystore android-app/android.keystore
          ls -la android-app/

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android-app
          bubblewrap build --skipPwaValidation

      - name: Find built files
        run: |
          echo "--- APK / AAB / JSON ---"
          find android-app -maxdepth 2 -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -la {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/*.json
          if-no-files-found: warn
