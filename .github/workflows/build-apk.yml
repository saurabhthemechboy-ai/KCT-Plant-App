name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Initialize Bubblewrap project
        run: |
          bubblewrap init --manifest="https://kct-plant-app.web.app/manifest.json" \
            --directory=android-app \
            --skipPwaValidation

      - name: Configure signing
        run: |
          cd android-app
          cat > signing-config.json <<EOF
          {
            "path": "../android.keystore",
            "alias": "${{ secrets.KEY_ALIAS }}",
            "password": "${{ secrets.KEYSTORE_PASSWORD }}",
            "keyPassword": "${{ secrets.KEY_PASSWORD }}"
          }
          EOF

      - name: Build APK
        run: |
          cd android-app
          bubblewrap build --skipPwaValidation --signingKeyPath=../android.keystore \
            --signingKeyAlias="${{ secrets.KEY_ALIAS }}" \
            --signingKeyPassword="${{ secrets.KEY_PASSWORD }}" \
            --password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: android-app/app-release-signed.apk

      - name: Upload assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: android-app/*.json
