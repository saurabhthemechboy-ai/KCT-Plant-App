name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install fresh Android SDK
        run: |
          # Install cmdline-tools into a fresh folder Bubblewrap will accept
          export SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"

          curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          # Accept licenses and install required packages
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          echo "--- SDK layout ---"
          ls -la "$SDK_ROOT"
          ls -la "$SDK_ROOT/build-tools" || echo "no build-tools"
          ls -la "$SDK_ROOT/platforms" || echo "no platforms"

      - name: Install Android SDK 'build' shim (Bubblewrap quirk)
        run: |
          # Bubblewrap looks for a folder named "build" directly under the SDK.
          # Create a symlink so validation passes.
          ln -sf "$ANDROID_HOME/build-tools/34.0.0" "$ANDROID_HOME/build" || true
          ls -la "$ANDROID_HOME" | grep build

      - name: Write Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Create TWA project
        run: |
          mkdir -p android-app
          cd android-app
          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.kct.plantapp",
            "host": "kct-plant-app.web.app",
            "name": "KCT Plant",
            "launcherName": "KCT Plant",
            "display": "standalone",
            "themeColor": "#0288d1",
            "navigationColor": "#0288d1",
            "navigationColorDark": "#01579b",
            "navigationDividerColor": "#0288d1",
            "navigationDividerColorDark": "#01579b",
            "backgroundColor": "#0288d1",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "maskableIconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kct-plant-app.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "isChromeOSOnly": false,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "kct"
            }
          }
          EOF
          cp ../android.keystore android.keystore

      - name: Doctor (diagnostic)
        run: |
          cd android-app
          bubblewrap doctor || true

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-app
          bubblewrap build --skipPwaValidation

      - name: Verify APK
        run: |
          ls -la android-app/
          test -f android-app/app-release-signed.apk && echo "✅ APK FOUND" || (echo "❌ APK MISSING" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: |
            android-app/app-release-signed.apk
            android-app/*.json
          if-no-files-found: error
