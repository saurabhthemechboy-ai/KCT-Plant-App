name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      BUBBLEWRAP_INSTALL_JDK: "false"
      BUBBLEWRAP_INSTALL_SDK: "false"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME || echo "SDK dir missing"
          ls -la $ANDROID_HOME/cmdline-tools || echo "cmdline-tools missing"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Create TWA project (non-interactive)
        run: |
          mkdir -p android-app
          cd android-app

          # Pre-seed Bubblewrap's config so it skips all prompts
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          cat > twa-manifest.json <<'EOF'
          {
            "packageId": "com.kct.plantapp",
            "host": "kct-plant-app.web.app",
            "name": "KCT Plant",
            "launcherName": "KCT Plant",
            "display": "standalone",
            "themeColor": "#0288d1",
            "navigationColor": "#0288d1",
            "navigationColorDark": "#01579b",
            "navigationDividerColor": "#0288d1",
            "navigationDividerColorDark": "#01579b",
            "backgroundColor": "#0288d1",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "maskableIconUrl": "https://kct-plant-app.web.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kct-plant-app.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "isChromeOSOnly": false,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "kct"
            }
          }
          EOF

          echo "--- Config written ---"
          cat ~/.bubblewrap/config.json
          echo "--- twa-manifest.json ---"
          cat twa-manifest.json

      - name: Copy keystore into project
        run: cp android.keystore android-app/android.keystore

      - name: Build APK (with piped answers)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android-app
          # Pipe default answers to any remaining prompt
          printf 'y\ny\ny\nn\nn\n' | bubblewrap build --skipPwaValidation --verbose || \
          printf 'n\nn\nn\n' | bubblewrap build --skipPwaValidation || true

      - name: Locate APK
        run: |
          echo "=== Files in android-app ==="
          ls -la android-app/ || true
          echo "=== Find APK ==="
          find android-app -type f -name "*.apk" -exec ls -la {} \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/*.json
          if-no-files-found: warn
