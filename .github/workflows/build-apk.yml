name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Prepare Android project manually
        run: |
          mkdir -p twa-project/app/src/main
          cd twa-project

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > settings.gradle <<'EOF'
          include ':app'
          rootProject.name = "KCT Plant"
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew
          chmod +x gradlew

      - name: Configure app module
        run: |
          cd twa-project/app

          cat > build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.kct.plantapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.kct.plantapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile file('../../android.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          mkdir -p src/main/res/values
          cat > src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">KCT Plant</string>
              <string name="asset_statements">
                  [{
                    \"relation\": [\"delegate_permission/common.handle_all_urls\"],
                    \"target\": {
                      \"namespace\": \"web\",
                      \"site\": \"https://kct-plant-app.web.app\"
                    }
                  }]
              </string>
          </resources>
          EOF

          cat > src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0288d1</color>
              <color name="colorPrimaryDark">#01579b</color>
          </resources>
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements"/>
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://kct-plant-app.web.app"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # UPDATED — download real PNG icons instead of empty placeholders
      - name: Download launcher icons
        run: |
          mkdir -p twa-project/app/src/main/res/mipmap-hdpi
          mkdir -p twa-project/app/src/main/res/mipmap-mdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p twa-project/app/src/main/res/mipmap-xxxhdpi

          # 512×512 — used as xxxhdpi and downscaled copies (Android will scale)
          curl -sSLo twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            https://kct-plant-app.web.app/icon-512.png

          cp twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             twa-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             twa-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             twa-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             twa-project/app/src/main/res/mipmap-mdpi/ic_launcher.png

          echo "--- Icon file sizes ---"
          find twa-project/app/src/main/res -name "ic_launcher.png" -exec ls -la {} \;

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd twa-project
          ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: |
          find twa-project -name "*.apk" -type f -exec ls -la {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: twa-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
