                      storeFile file('../../android.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">KCT Plant</string>
              <string name="asset_statements"><![CDATA[
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "web",
              "site": "https://kct-plant-app.web.app"
            }
          }]
          ]]></string>
          </resources>
          EOF

          cat > src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#0288D1</color>
              <color name="colorPrimaryDark">#01579B</color>
          </resources>
          EOF

          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://kct-plant-app.web.app" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Download and verify KCT app icon
        run: |
          set -euo pipefail
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "twa-project/app/src/main/res/mipmap-$d"
          done

          curl --fail --location --silent --show-error             -o twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png             https://kct-plant-app.web.app/icon-512.png

          file twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          for d in mdpi hdpi xhdpi xxhdpi; do
            cp twa-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png                "twa-project/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          cd twa-project
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="twa-project/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kct-plant-apk
          path: twa-project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
