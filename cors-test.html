<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCT Backend CORS Test</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 700px; margin: 0 auto; background: #f5f5f5; }
    h1 { font-size: 20px; color: #01579b; }
    p { color: #555; }
    button { padding: 14px 20px; margin: 5px 5px 5px 0; font-size: 15px; cursor: pointer; background: #0288d1; color: white; border: 0; border-radius: 8px; font-weight: bold; }
    button:active { transform: scale(0.97); }
    pre { background: white; padding: 14px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; font-size: 12px; border: 1px solid #ddd; min-height: 100px; }
    .ok { color: #2e7d32; font-weight: bold; }
    .fail { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <h1>KCT Backend CORS Test</h1>
  <p>Confirms Firebase can reach the real KCT Apps Script backend.</p>

  <button onclick="runTest1()">Test 1 — Small POST</button>
  <button onclick="runTest2()">Test 2 — GET ping</button>
  <button onclick="runTest3()">Test 3 — Large POST (~2 MB)</button>

  <pre id="out">Ready. Tap a test button.</pre>

  <script>
    // ---- Real KCT backend URL ----
    const API = "https://script.google.com/macros/s/AKfycby_eHVk3fAsjTiKyIk6RHDeOCJP3YCiLrBrYibw2QT_fsXUyQjIsQ9l7mOkltaYphhrOg/exec";

    const out = document.getElementById("out");
    function log(msg) { out.textContent += "\n" + msg; }
    function reset() { out.textContent = ""; }

    async function runTest1() {
      reset();
      log("═══ TEST 1: Small POST ═══");
      log("Calling: getEquipmentList");
      try {
        const r = await fetch(API, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "getEquipmentList", payload: {} })
        });
        log("HTTP status: " + r.status);
        log("Response type: " + r.type);
        const text = await r.text();
        log("Body (first 400): " + text.substring(0, 400));
        if (r.ok && text.indexOf("C1") !== -1) {
          log("✅ TEST 1 PASSED");
        } else {
          log("❌ TEST 1 FAILED");
        }
      } catch (err) {
        log("❌ EXCEPTION: " + err.message);
      }
    }

    async function runTest2() {
      reset();
      log("═══ TEST 2: GET ping ═══");
      try {
        const r = await fetch(API, { redirect: "follow" });
        log("HTTP status: " + r.status);
        const text = await r.text();
        log("Body (first 200): " + text.substring(0, 200));
        if (r.ok) {
          log("✅ TEST 2 PASSED");
        } else {
          log("❌ TEST 2 FAILED");
        }
      } catch (err) {
        log("❌ EXCEPTION: " + err.message);
      }
    }

    async function runTest3() {
      reset();
      log("═══ TEST 3: Large POST (~2 MB) ═══");
      const big = "A".repeat(2800000);
      try {
        const r = await fetch(API, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "getEquipmentList",
            payload: { _bigTest: big }
          })
        });
        log("HTTP status: " + r.status);
        log("Response type: " + r.type);
        const text = await r.text();
        log("Body (first 400): " + text.substring(0, 400));
        if (r.ok && text.indexOf("C1") !== -1) {
          log("✅ TEST 3 PASSED");
        } else {
          log("❌ TEST 3 FAILED");
        }
      } catch (err) {
        log("❌ EXCEPTION: " + err.message);
      }
    }
  </script>
</body>
</html>
